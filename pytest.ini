[pytest]
markers =
    ui: UI tests driven through Playwright
    api: API tests driven through requests
    db: Database validation tests
    smoke: Small subset of critical sanity tests
    regression: Full regression suite
    integration: Flask-level unit/API tests for internal services (e.g. n8n_webhook.py)

addopts = -v --alluredir=reports/allure-results
testpaths = tests

log_cli = true
log_cli_level = INFO
